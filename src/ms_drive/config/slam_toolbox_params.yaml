slam_toolbox:
  ros__parameters:
    use_sim_time: false
    map_update_interval: 1000.0
    max_laser_range: 10.0 # perhaps play around with max range, should be in meters.
    resolution: 0.05
    scan_msg_expected_ranges: 503  # 0 = accept variable size

    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.075
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    do_loop_closing: false
    do_covariance_estimation: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coefficient: 1.0

    scan_topic: /scan_fixed
    base_frame: base_link
    odom_frame: odom
    map_frame: map
